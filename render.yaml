services:
  - type: web
    name: knowledge-assistant-backend
    runtime: docker
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: MIN_SCORE
        value: "0.45"
      - key: ALLOWED_ORIGINS
        value: "*"
