services:
  - type: web
    name: knowledge-assistant-backend
    runtime: docker
    plan: free
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_EMBEDDING_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: EMBED_MODEL
        value: nvidia/nemotron-3-embed-1b
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: LLM_TEMPERATURE
        value: "0.5"
      - key: LLM_TOP_P
        value: "1.0"
      - key: MIN_SCORE
        value: "0.45"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge-assistant-db
          property: connectionString

databases:
  - name: knowledge-assistant-db
    plan: free
    databaseName: knowledge_assistant
